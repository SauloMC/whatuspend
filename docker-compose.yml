services:
  # 1. Main Next.js 15 Application
  whatuspend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatuspend-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - minio-storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Local Object & Image Storage (MinIO - S3 Compatible)
  # Usado para persistencia de imágenes de perfil (avatars) y logos de empresas en Docker
  minio-storage:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: whatuspend-minio
    restart: always
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-WhatuSpendMinio2026!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Bucket Auto-Provisioner for MinIO
  # Crea automáticamente los buckets públicos 'avatars' y 'company-logos' al iniciar
  minio-create-buckets:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: whatuspend-minio-init
    depends_on:
      minio-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-storage:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-WhatuSpendMinio2026!};
      mc mb local/avatars --ignore-existing;
      mc mb local/company-logos --ignore-existing;
      mc anonymous set download local/avatars;
      mc anonymous set download local/company-logos;
      echo 'Buckets avatars y company-logos inicializados con descarga pública';
      exit 0;
      "

volumes:
  minio_data:
    driver: local
